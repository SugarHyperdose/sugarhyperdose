name: Deploy to Neocities
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload files to Neocities
        env:
          NEOCITIES_API_TOKEN: ${{ secrets.NEOCITIES_API_TOKEN }}
        run: |
          python3 - <<'EOF'
          import os, urllib.error, urllib.request, uuid

          token = os.environ["NEOCITIES_API_TOKEN"]
          skip_dirs = {".git", ".github"}
          skip_files = {".gitignore", ".gitattributes"}
          allowed_exts = {
              ".html", ".htm", ".css", ".js", ".json", ".xml", ".txt", ".md",
              ".csv", ".svg", ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico",
              ".woff", ".woff2", ".ttf", ".otf", ".eot"
          }

          for root, dirs, filenames in os.walk("."):
              dirs[:] = [d for d in dirs if d not in skip_dirs]
              for name in filenames:
                  if name in skip_files:
                      continue
                  full_path = os.path.join(root, name)
                  if os.path.getsize(full_path) == 0:
                      print(f"Skipping empty file: {full_path}")
                      continue
                  ext = os.path.splitext(name)[1].lower()
                  if ext not in allowed_exts:
                      print(f"Skipping unsupported file type for free site: {full_path}")
                      continue

                  rel_path = os.path.relpath(full_path, ".").replace("\\", "/")
                  boundary = uuid.uuid4().hex.encode()
                  with open(full_path, "rb") as f:
                      data = f.read()

                  body = (
                      b"--" + boundary + b"\r\n"
                      + f'Content-Disposition: form-data; name="{rel_path}"; filename="{rel_path}"\r\n'.encode()
                      + b"Content-Type: application/octet-stream\r\n\r\n"
                      + data + b"\r\n"
                      + b"--" + boundary + b"--\r\n"
                  )

                  req = urllib.request.Request(
                      "https://neocities.org/api/upload",
                      data=body,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Content-Type": f"multipart/form-data; boundary={boundary.decode()}",
                      },
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req) as resp:
                          print(f"OK {rel_path}: {resp.read().decode()}")
                  except urllib.error.HTTPError as e:
                      err_body = e.read().decode(errors="replace")
                      print(f"SKIP/FAIL {rel_path} ({e.code}): {err_body}")
          EOF